<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Criptografia Offline</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
    textarea { width: 100%; height: 150px; margin-bottom: 10px; font-family: monospace; }
    input, button { padding: 10px; margin-top: 5px; width: 100%; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
    h2 { text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔐 Criptografia Simétrica (Offline)</h2>

    <label>🔑 Senha:</label>
    <input type="password" id="senha" placeholder="Digite sua senha">

    <label>📝 Texto (a criptografar ou descriptografar):</label>
    <textarea id="entrada" placeholder="Digite aqui seus dados..."></textarea>

    <button onclick="criptografar()">Criptografar 🔒</button>
    <button onclick="descriptografar()">Descriptografar 🔓</button>

    <label>📦 Resultado:</label>
    <textarea id="saida" readonly></textarea>
  </div>

  <script>
    function gerarChave(senha) {
      // Deriva a chave da senha com SHA256
      return CryptoJS.SHA256(senha).toString();
    }

    function criptografar() {
      const senha = document.getElementById("senha").value;
      const texto = document.getElementById("entrada").value;

      if (!senha || !texto) return alert("Preencha a senha e o texto!");

      const chave = gerarChave(senha);
      const ciphertext = CryptoJS.AES.encrypt(texto, chave).toString();

      document.getElementById("saida").value = ciphertext;
    }

    function descriptografar() {
      const senha = document.getElementById("senha").value;
      const criptado = document.getElementById("entrada").value;

      if (!senha || !criptado) return alert("Preencha a senha e o texto criptografado!");

      const chave = gerarChave(senha);

      try {
        const bytes = CryptoJS.AES.decrypt(criptado, chave);
        const texto = bytes.toString(CryptoJS.enc.Utf8);

        if (!texto) throw "Erro ao descriptografar";

        document.getElementById("saida").value = texto;
      } catch (e) {
        alert("⚠️ Erro ao descriptografar: senha incorreta ou texto inválido.");
        document.getElementById("saida").value = "";
      }
    }
  </script>
</body>
</html>
